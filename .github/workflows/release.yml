name: release

# Each push to main runs release-please, which opens or updates a release PR
# from the conventional-commit history. Merging that PR tags vX.Y.Z and creates
# the GitHub release; the jobs below then build the plugin archive for each
# target the Tracon plugin contract names and attach them, with checksums.txt,
# to that release. Each archive holds tracon-plugin.toml, bin/hora and ui/ (the
# built page, which the node serves itself).
on:
  push:
    branches: [main]
  # Re-run the artefact jobs for a release that already exists, when a build or
  # an upload failed part way. Nothing here re-tags.
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag, e.g. v0.2.0"
        required: true

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Two merges landing seconds apart could each see no open release PR and
    # both open one. Pushes to main take this job one at a time; the workflow
    # itself has no group, which would let a later merge drop a queued
    # release's artefact jobs. A manual re-run gets a group of its own.
    concurrency:
      group: ${{ github.event_name == 'push' && 'release-please' || format('release-please-dispatch-{0}', github.run_id) }}
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.out.outputs.release_created }}
      version: ${{ steps.out.outputs.version }}
      tag: ${{ steps.out.outputs.tag }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: github.event_name == 'push'
        id: rp
        with:
          # A PR opened with GITHUB_TOKEN gets no CI run until someone approves
          # it by hand, and the release PR has required checks. This token opens
          # it as a user instead. Without the secret it falls back to
          # GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: out
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_CREATED: ${{ steps.rp.outputs.release_created }}
          TAG_NAME: ${{ steps.rp.outputs.tag_name }}
          VERSION: ${{ steps.rp.outputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            {
              echo "release_created=true"
              echo "tag=$INPUT_TAG"
              echo "version=${INPUT_TAG#v}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "release_created=$RELEASE_CREATED"
              echo "tag=$TAG_NAME"
              echo "version=$VERSION"
            } >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            linker: aarch64-linux-gnu-gcc
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Check the tag, Cargo.toml and tracon-plugin.toml agree
        shell: bash
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          plugin=$(sed -n 's/^version = "\(.*\)"$/\1/p' tracon-plugin.toml | head -1)
          if [ "$TAG" != "v$crate" ] || [ "$plugin" != "$crate" ]; then
            echo "tag $TAG, Cargo.toml $crate and tracon-plugin.toml $plugin disagree" >&2
            exit 1
          fi
          echo "VERSION=$crate" >> "$GITHUB_ENV"
      # The binary embeds spa/dist for standalone use, and the archive ships
      # the same build as ui/, so the page is built first.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile --cwd spa
      - run: bun run --cwd spa build
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - name: Install the cross linker
        if: matrix.linker
        env:
          LINKER: ${{ matrix.linker }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=$LINKER" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=$LINKER" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target "$TARGET"
      - name: Package
        shell: bash
        run: |
          mkdir -p stage/bin dist
          cp "target/$TARGET/release/hora" stage/bin/
          cp tracon-plugin.toml stage/
          cp -R spa/dist stage/ui
          tar -czf "dist/hora-$VERSION-$TARGET.tar.gz" -C stage tracon-plugin.toml bin ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hora-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hora-*
          path: dist
          merge-multiple: true
      - name: Write checksums.txt
        working-directory: dist
        run: sha256sum -- *.tar.gz > checksums.txt && cat checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      # release-please created the release when its PR merged; attach the
      # archives to it. --clobber lets a manual re-run replace a partial upload.
      - name: Attach to the release
        run: gh release upload "$TAG" dist/* --clobber
